name: Build Kalimat Desktop

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps (none — remote-URL wrapper, just the Tauri CLI)
        run: npm install

      # Windows builds an unsigned .msi/.exe (SmartScreen warning, still
      # fully installable) until a code-signing cert is added. Mac builds
      # an unsigned .app/.dmg (Gatekeeper warning, right-click-Open bypass)
      # until the Apple Developer Program is purchased — see README.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kalimat Desktop v__VERSION__"
          releaseBody: "Build automatique. Mac: .dmg non signé (Gatekeeper → clic droit > Ouvrir). Windows: .msi/.exe non signé (SmartScreen → Informations complémentaires > Exécuter quand même)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
